services:
  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-carbook}
      POSTGRES_USER: ${DB_USERNAME:-carbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carbook}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    mem_limit: ${DB_MEMORY_LIMIT:-256m}
    cpus: ${DB_CPU_LIMIT:-0.50}
    volumes:
      - carbook_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-carbook} -d ${DB_DATABASE:-carbook}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carbook_database:
